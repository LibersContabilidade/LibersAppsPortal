  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    font-family: 'Inter', sans-serif;\n    background: var(--bg);\n    color: var(--text);\n    min-height: 100vh;\n    overflow-x: hidden;\n  }\n\n  /* ── NAV ── */\n  nav {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n    background: rgba(247,247,245,0.88);\n    backdrop-filter: blur(14px);\n    border-bottom: 1px solid var(--border);\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 48px;\n    height: 64px;\n  }\n  .nav-logo {\n    display: flex; align-items: center; gap: 12px;\n    text-decoration: none;\n  }\n  .nav-logo img {\n    height: 36px; width: auto;\n  }\n  .nav-label {\n    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;\n    text-transform: uppercase; color: var(--text-mid);\n  }\n  .nav-right {\n    font-size: 13px; color: var(--text-soft); font-weight: 400;\n    letter-spacing: 0.02em;\n  }\n\n  /* ── HERO ── */\n  .hero {\n    padding: 148px 48px 80px;\n    display: flex; flex-direction: column; align-items: center; gap: 24px;\n    text-align: center;\n    position: relative;\n    overflow: hidden;\n  }\n  .hero::before {\n    content: '';\n    position: absolute; top: -120px; left: 50%; transform: translateX(-50%);\n    width: 700px; height: 700px;\n    background: radial-gradient(circle, var(--orange-glow) 0%, transparent 70%);\n    pointer-events: none;\n  }\n  .hero-eyebrow {\n    display: inline-flex; align-items: center; gap: 8px;\n    background: var(--orange-dim);\n    border: 1px solid rgba(245,130,31,0.3);\n    color: var(--orange);\n    padding: 5px 14px;\n    border-radius: 100px;\n    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;\n  }\n  .hero-eyebrow span { width: 6px; height: 6px; background: var(--orange); border-radius: 50%; display: inline-block; animation: pulse 2s ease-in-out infinite; }\n  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }\n\n  .hero h1 {\n    font-size: clamp(36px, 5vw, 64px);\n    font-weight: 800;\n    line-height: 1.1;\n    color: var(--text);\n    max-width: 720px;\n  }\n  .hero h1 em {\n    font-style: normal;\n    color: var(--orange);\n  }\n  .hero p {\n    font-size: 18px; color: var(--text-mid); max-width: 520px;\n    line-height: 1.7; font-weight: 400;\n  }\n  .hero-logo {\n    margin-bottom: 8px;\n  }\n  .hero-logo img {\n    height: 80px; width: auto;\n    filter: drop-shadow(0 4px 24px rgba(245,130,31,0.18));\n  }\n\n  /* ── APPS GRID ── */\n  .apps-section {\n    padding: 0 48px 100px;\n    max-width: 1100px;\n    margin: 0 auto;\n  }\n  .section-title {\n    font-size: 13px; font-weight: 600; letter-spacing: 0.1em;\n    text-transform: uppercase; color: var(--text-soft);\n    margin-bottom: 24px;\n    padding-left: 2px;\n  }\n  .apps-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));\n    gap: 20px;\n  }\n\n  /* ── APP CARD ── */\n  .app-card {\n    background: var(--surface);\n    border: 1px solid var(--border);\n    border-radius: 16px;\n    padding: 32px;\n    display: flex; flex-direction: column; gap: 20px;\n    cursor: pointer;\n    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;\n    position: relative;\n    overflow: hidden;\n  }\n  .app-card::after {\n    content: '';\n    position: absolute; inset: 0;\n    background: linear-gradient(135deg, var(--orange-dim) 0%, transparent 60%);\n    opacity: 0;\n    transition: opacity 0.3s ease;\n    pointer-events: none;\n  }\n  .app-card:hover {\n    transform: translateY(-4px);\n    box-shadow: 0 16px 48px rgba(0,0,0,0.10), 0 0 0 1px var(--orange);\n    border-color: var(--orange);\n  }\n  .app-card:hover::after { opacity: 1; }\n\n  .card-header {\n    display: flex; align-items: flex-start; justify-content: space-between;\n  }\n  .app-icon {\n    width: 56px; height: 56px;\n    background: var(--gray-dark);\n    border-radius: 14px;\n    display: flex; align-items: center; justify-content: center;\n    font-size: 26px;\n    flex-shrink: 0;\n    box-shadow: 0 4px 16px rgba(0,0,0,0.15);\n  }\n  .app-icon.orange-bg {\n    background: var(--orange);\n  }\n  .app-badge {\n    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;\n    text-transform: uppercase;\n    padding: 4px 10px; border-radius: 100px;\n    background: var(--surface2);\n    color: var(--text-soft);\n    border: 1px solid var(--border);\n  }\n\n  .card-body { flex: 1; }\n  .app-name {\n    font-size: 22px; font-weight: 700; color: var(--text);\n    margin-bottom: 8px; line-height: 1.2;\n  }\n  .app-desc {\n    font-size: 14px; color: var(--text-mid); line-height: 1.6;\n  }\n\n  .card-tags {\n    display: flex; flex-wrap: wrap; gap: 6px;\n  }\n  .tag {\n    font-size: 11px; font-weight: 500;\n    padding: 4px 10px; border-radius: 6px;\n    background: var(--orange-dim);\n    color: var(--orange);\n    border: 1px solid rgba(245,130,31,0.2);\n  }\n\n  .card-footer {\n    display: flex; align-items: center; justify-content: space-between;\n    padding-top: 16px;\n    border-top: 1px solid var(--border);\n  }\n  .open-btn {\n    display: inline-flex; align-items: center; gap: 8px;\n    background: var(--orange);\n    color: #fff;\n    font-size: 13px; font-weight: 600; letter-spacing: 0.02em;\n    padding: 10px 20px; border-radius: 10px;\n    border: none; cursor: pointer;\n    transition: background 0.15s, transform 0.1s;\n  }\n  .open-btn:hover { background: var(--orange-light); transform: scale(1.03); }\n  .open-btn svg { width: 14px; height: 14px; flex-shrink: 0; }\n  .card-meta { font-size: 12px; color: var(--text-soft); }\n\n  /* ── MODAL OVERLAY ── */\n  .modal-overlay {\n    position: fixed; inset: 0; z-index: 200;\n    background: rgba(20,20,18,0.75);\n    backdrop-filter: blur(6px);\n    display: flex; flex-direction: column;\n    opacity: 0; pointer-events: none;\n    transition: opacity 0.25s g viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 8h10M9 4l4 4-4 4\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <span class=\"card-meta\">v3 · Fiscal<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Planilha de Custo -->\n      <div class=\"app-card\" onclick=\"openApp('apps/planilha-custo.html', 'Planilha de Custo de Funcionário')\">\n        <div class=\"card-header\">\n          <div class=\"app-icon\">📊<\u002Fdiv>\n          <span class=\"app-badge\">RH<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"card-body\">\n          <div class=\"app-name\">Planilha de Custo de Funcionário<\u002Fdiv>\n          <div class=\"app-desc\">Calcule o custo total de um colaborador para a empresa, incluindo encargos trabalhistas, benefícios e todos os tributos incidentes sobre a folha de pagamento.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-tags\">\n          <span class=\"tag\">Folha<\u002Fspan>\n          <span class=\"tag\">Encargos<\u002Fspan>\n          <span class=\"tag\">CLT<\u002Fspan>\n          <span class=\"tag\">RH<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"card-footer\">\n          <button class=\"open-btn\">\n            Abrir app\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 8h10M9 4l4 4-4 4\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <span class=\"card-meta\">v1 · RH<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<!-- MODAL -->\n<div class=\"modal-overlay\" id=\"modal\">\n  <div class=\"modal-bar\">\n    <div class=\"modal-bar-title\">\n      <span class=\"dot\"><\u002Fspan>\n      <span id=\"modal-title\">App<\u002Fspan>\n    <\u002Fdiv>\n    <button class=\"modal-close\" onclick=\"closeApp()\" title=\"Fechar\">✕<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"modal-iframe-wrap\">\n    <iframe id=\"modal-iframe\" src=\"\" title=\"Aplicativo\"><\u002Fiframe>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<footer>\n  <div class=\"foot-brand\">\n    <img src=\"3694774e-3e47-465b-aa15-db98dda2f1e1\" alt=\"Libers\">\n    Libers Assessoria Contábil\n  <\u002Fdiv>\n  <div class=\"foot-right\">© 2026 · Uso interno<\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  function openApp(src, title) {\n    document.getElementById('modal-iframe').src = src;\n    document.getElementById('modal-title').textContent = title;\n    document.getElementById('modal').classList.add('open');\n    document.body.style.overflow = 'hidden';\n  }\n  function closeApp() {\n    const modal = document.getElementById('modal');\n    modal.classList.remove('open');\n    document.body.style.overflow = '';\n    setTimeout(() => { document.getElementById('modal-iframe').src = ''; }, 300);\n  }\n  document.getElementById('modal').addEventListener('click', function(e) {\n    if (e.target === this) closeApp();\n  });\n  document.addEventListener('keydown', function(e) {\n    if (e.key === 'Escape') closeApp();\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
